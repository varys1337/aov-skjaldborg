name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AOV_SYSTEM_PATH: ${{ github.workspace }}/.ci/aov

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out pinned AoV 14.7 source
        uses: actions/checkout@v4
        with:
          repository: cragstone/aov
          ref: 08965ef0b2d95c806858542e7cfb036cf3014714
          path: .ci/aov
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install development tooling
        run: npm ci

      - name: Run validation and contracts
        run: npm run ci

      - name: Build installable module assets
        run: npm run build

      - name: Verify reproducible release assets
        shell: bash
        run: |
          cp release/SHA256SUMS.txt "$RUNNER_TEMP/skjaldborg-checksums.txt"
          npm run build
          cmp "$RUNNER_TEMP/skjaldborg-checksums.txt" release/SHA256SUMS.txt
          unzip -t release/aov-skjaldborg.zip
          (cd release && sha256sum -c SHA256SUMS.txt)

      - name: Upload CI build
        uses: actions/upload-artifact@v4
        with:
          name: aov-skjaldborg-${{ github.sha }}
          path: |
            release/aov-skjaldborg.zip
            release/module.json
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
